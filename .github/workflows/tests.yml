name: Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python --version
          pip install -r requirements.txt

      - name: Check model file
        run: |
          echo "Repository contents:"
          find . -maxdepth 3 -type f | sort
          echo "Checking production model..."
          ls -lah data/processed/
          git status --short
          git ls-files data/processed/random_forest_model.pkl
          test -f data/processed/random_forest_model.pkl
          stat data/processed/random_forest_model.pkl

      - name: Run tests
        run: |
          python --version
          pytest tests -v